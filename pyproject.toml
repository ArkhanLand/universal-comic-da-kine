[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "universal-comic-da-kine"
version = "0.1.0"
description = "Toolkit for ingesting, transforming, editing, and converting comic-like files"

readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.27", "typer>=0.12"]

[project.optional-dependencies]
dev = ["mypy>=1.15", "pytest>=8", "ruff>=0.12"]

[project.scripts]
ucd = "ucd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ucd"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/ucd/cli.py" = ["B008"]
"src/ucd/services/marvel_unlimited.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require access to live external services",
]
